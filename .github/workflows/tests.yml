# Run the test suite and execute every tutorial notebook on each push and PR.
# tests/legacy compares against data generated by Octave runs of the 2011
# MATLAB code, so it is run by hand, not here.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install fluidlets with the tutorial extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tutorials]" pytest
      - name: Unit and validation tests
        run: python -m pytest -q --ignore=tests/legacy
      - name: Tutorial notebooks
        run: python -m pytest --nbmake tutorials
